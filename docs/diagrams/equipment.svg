h="143.0" height="55.0" fill="#fff" stroke="#1b2520"/><text x="185.0" y="442.0" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="13">OWC dock</text><rect x="735.5" y="372.65" width="137.5000000000001" height="93.5" fill="none" stroke="#626c66" stroke-dasharray="7 5"/><rect x="136.0" y="405.65" width="154.0" height="60.5" fill="none" stroke="#626c66" stroke-dasharray="7 5"/></g><text x="70" y="42" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="22">20 / EQUIPMENT UNDER THE DESK</text><text x="70" y="76" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="15">TOP VIEW THROUGH THE TABLETOP · CONCEPT CLEARANCES</text><text x="90" y="511" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="16">FRONT / SEATED SIDE</text><text x="342" y="455" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="16">700 mm central knee width</text><text x="70" y="550" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="16">Rear shelf: 1615 × 230 × 18 mm · top 518 mm · 186 mm clear above</text><text x="70" y="580" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="16">472 mm knee depth before the rear shelf; keep the middle open.</text><text x="70" y="610" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="15">Front holders: controls face the room. Check case, plugs, vents and short screws.</text><text x="70" y="640" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="15">Mac ports face along shelf. Strap bricks separately and retain service loops.</text><text x="70" y="680" stroke="none" fill="#1b2520" font-family="Arial,sans-serif" font-size="14">Router, brick and holder envelopes are provisional. Not a drilling template.</text></svg>